<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d7358"/>
      <stop offset="100%" style="stop-color:#0a5c47"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <!-- Vault Door Circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#a7f3d0" stroke-width="8" opacity="0.3"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#a7f3d0" stroke-width="4" opacity="0.2"/>
  <!-- Rupee Symbol -->
  <text x="256" y="290" font-family="Arial, sans-serif" font-size="180" font-weight="bold" fill="#ecfdf5" text-anchor="middle">₹</text>
  <!-- Sparkle accents -->
  <circle cx="380" cy="140" r="8" fill="#a7f3d0"/>
  <circle cx="140" cy="360" r="6" fill="#a7f3d0" opacity="0.7"/>
  <circle cx="400" cy="340" r="5" fill="#a7f3d0" opacity="0.5"/>
